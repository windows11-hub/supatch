name: Build KPM Host Agent (GKI 6.6)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # 直接使用 DDK 官方提供的 6.6 容器环境，省去装 Clang 和内核树的麻烦
      image: ghcr.io/ylarod/ddk-min:android15-6.6
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show DDK Environment Info
        run: |
          echo "Kernel version in DDK:"
          ls -la /sys/kernel 2>/dev/null || true
          clang --version

      - name: Build kpm_host.ko (GKI 6.6)
        run: |
          chmod +x build/build.sh
          
          # 1. 设置 DDK 容器内正确的内核树路径
          export KDIR="/opt/ddk/kdir/android15-6.6"
          echo "Using KDIR: $KDIR"
          
          # 2. 动态查找 DDK 容器内的 Clang 路径
          # 通常在 /opt/ddk/clang/ 下
          REAL_CLANG_BIN=$(find /opt/ddk/clang -name "clang" -type f | head -n 1 | xargs dirname)
          echo "Found real clang bin path: $REAL_CLANG_BIN"
          
          if [ -z "$REAL_CLANG_BIN" ]; then
            echo "ERROR: Could not find clang in /opt/ddk"
            exit 1
          fi
          
          # 3. 修改原脚本里写死的 Clang 路径
          cp build/build.sh build/build.sh.bak
          sed -i "s|B=/root/prebuilt_clang/clang-r416183/bin|B=$REAL_CLANG_BIN|g" build/build.sh
          
          # 4. 确保 .config 就位，骗过脚本的检测
          if [ -f "$KDIR/.config" ]; then
            mkdir -p /root/kernel_common
            cp "$KDIR/.config" /root/kernel_common/.config
            echo "Config copied from $KDIR/.config"
          else
            echo "ERROR: .config not found in $KDIR"
            exit 1
          fi
          
          # 5. 执行修改后的编译脚本
          bash build/build.sh
          
          # 6. 重命名产物以便区分
          if [ -f "build/kpm_host.ko" ]; then
            mv build/kpm_host.ko build/kpm_host-gki-6.6.ko
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: |
            build/kpm_host-gki-6.6.ko
            helper/suzhi_loader_arm64
            helper/suzhi_loader
          # 如果找不到匹配的文件，也不要让 workflow 报错
          if-no-files-found: warn

      - name: Create Release (Optional)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/kpm_host-gki-6.6.ko
            helper/suzhi_loader_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
