name: Build and Verify KPM Host

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          set -e
          echo "=> KDIR: $KDIR"
          
          # 1. 强行修改 DDK 源码树的版本号宏
          sed -i 's/^VERSION = .*/VERSION = 6/' $KDIR/Makefile
          sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 6/' $KDIR/Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' $KDIR/Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION = -android15-11/' $KDIR/Makefile
          echo "" > $KDIR/scripts/setlocalversion
          
          # 2. 删除 6.6 不支持的调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c
          
          # 3. 编译模块
          echo "=> Compiling module..."
          make -C "$KDIR" \
            M="$PWD/src" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format" \
            modules

          # 4. 处理产物
          echo "=> Handling output..."
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
          else
            echo "=> ERROR: kpm_host.ko not found in src/"
            exit 1
          fi

          # 5. 二进制强改 Vermagic（纯 sed，无 Python 缩进烦恼）
          echo "=> Patching binary vermagic..."
          OLD_VER="6.6.127-4k-g46a034eca005-dirty SMP preempt mod_unload modversions aarch64"
          NEW_VER="6.6.118-android15-11 SMP preempt mod_unload modversions aarch64"
          
          # 由于 sed 替换长度必须一致，这里用 \0 补齐（注意这里不破坏 ELF 结构）
          PAD=$(printf '%*s' $((${#OLD_VER} - ${#NEW_VER})) | tr ' ' '\0')
          sed -i -b "s/$OLD_VER/$NEW_VER$PAD/g" build/kpm_host-gki-6.6.ko

          # 6. 输出体检信息
          echo ""
          echo "=================================================="
          echo "                 LKM VERIFICATION"
          echo "=================================================="
          echo "Vermagic:"
          modinfo -F vermagic build/kpm_host-gki-6.6.ko
          echo ""
          echo "Sections:"
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.modinfo|\.versions" || true
          echo ""
          echo "SHA256:"
          sha256sum build/kpm_host-gki-6.6.ko
          echo "=================================================="

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error
