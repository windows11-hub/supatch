name: Build KPM Host Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-lkm:
    name: Build kpm_host.ko (GKI 6.6)
    runs-on: ubuntu-latest
    container:
      # 核心：抄 YukiZygisk 的作业，使用完整版 ddk 镜像，并锁定 20260828 版本
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build kpm_host
        shell: bash
        run: |
          set -e
          echo "Environment KDIR: ${KDIR:-<empty>}"
          
          # 如果完整版镜像没有自动设置 KDIR，这里做个兜底探测
          if [ -z "${KDIR:-}" ] || [ ! -d "$KDIR" ]; then
            echo "KDIR not set by image, searching..."
            export KDIR=$(find /opt/ddk /root -maxdepth 4 -type d -name "kernel_common" -o -name "android15-6.6" 2>/dev/null | head -n 1)
            echo "Fallback KDIR: $KDIR"
          fi
          
          if [ -z "$KDIR" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "ERROR: KDIR is still unavailable."
            exit 1
          fi

          chmod +x build/build.sh
          
          # 修改 build.sh 以适应容器环境
          cp build/build.sh build/build.sh.bak
          
          # 1. 修正 Clang 路径（完整版镜像里一般在 /usr/bin 或通过环境变量调用）
          sed -i "s|B=/root/prebuilt_clang/clang-r416183/bin|B=/usr/bin|g" build/build.sh
          
          # 2. 修正源码路径（源码在 src/ 目录下）
          sed -i 's|M="$HERE"|M="$HERE/../src"|g' build/build.sh
          
          # 3. 关闭会报错的新版 CFI 参数，关掉格式警告
          sed -i 's|-fsanitize-cfi-canonical-jump-tables||g' build/build.sh
          sed -i 's|KCFLAGS="-ffixed-x18"|KCFLAGS="-ffixed-x18 -Wno-format"|g' build/build.sh
          
          # 4. 删除 6.6 下不支持的 resolve_cfi_shadow 调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c

          # 执行编译
          bash build/build.sh || true
          
          # 产物重命名并移入 build 目录
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
            echo "=== Successfully built build/kpm_host-gki-6.6.ko ==="
            ls -lh build/kpm_host-gki-6.6.ko
          else
            echo "ERROR: src/kpm_host.ko not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error
