name: Build and Verify KPM Host

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          set -e
          echo "=> KDIR: $KDIR"
          
          # 1. 移除源码里不支持的 6.6 CFI 调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c
          
          # 2. 编译模块
          echo "=> Compiling module..."
          make -C "$KDIR" \
            M="$PWD/src" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format" \
            modules

          # 3. 处理产物
          echo "=> Handling output..."
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
          else
            echo "=> ERROR: kpm_host.ko not found in src/"
            exit 1
          fi

          # 4. 用 echo 逐行生成 Python 脚本修补 vermagic
          echo "ko_path = 'build/kpm_host-gki-6.6.ko'" > /tmp/patch_ko.py
          echo "with open(ko_path, 'rb') as f:" >> /tmp/patch_ko.py
          echo "    data = f.read()" >> /tmp/patch_ko.py
          echo "old_vers = [" >> /tmp/patch_ko.py
          echo "    b'6.6.127-4k-g46a034eca005-dirty SMP preempt mod_unload modversions aarch64'," >> /tmp/patch_ko.py
          echo "    b'6.6.127 SMP preempt mod_unload modversions aarch64'" >> /tmp/patch_ko.py
          echo "]" >> /tmp/patch_ko.py
          echo "new_str = b'6.6.118-android15-11 SMP preempt mod_unload modversions aarch64'" >> /tmp/patch_ko.py
          echo "patched = False" >> /tmp/patch_ko.py
          echo "for old_str in old_vers:" >> /tmp/patch_ko.py
          echo "    if old_str in data:" >> /tmp/patch_ko.py
          echo "        pad_len = len(old_str) - len(new_str)" >> /tmp/patch_ko.py
          echo "        replace_str = new_str + (b'\x00' * pad_len)" >> /tmp/patch_ko.py
          echo "        data = data.replace(old_str, replace_str)" >> /tmp/patch_ko.py
          echo "        patched = True" >> /tmp/patch_ko.py
          echo "        print('==> Patched string: ' + old_str.decode())" >> /tmp/patch_ko.py
          echo "if patched:" >> /tmp/patch_ko.py
          echo "    with open(ko_path, 'wb') as f:" >> /tmp/patch_ko.py
          echo "        f.write(data)" >> /tmp/patch_ko.py
          echo "    print('==> Successfully patched file.')" >> /tmp/patch_ko.py
          echo "else:" >> /tmp/patch_ko.py
          echo "    print('==> Warning: old vermagic not found.')" >> /tmp/patch_ko.py

          echo "=> Patching binary vermagic..."
          python3 /tmp/patch_ko.py

          # 5. 输出体检信息（含未定义符号检查）
          echo ""
          echo "=================================================="
          echo "                 LKM VERIFICATION"
          echo "=================================================="
          echo "Vermagic:"
          modinfo -F vermagic build/kpm_host-gki-6.6.ko
          
          echo -e "\n=== CHECK: Modversions & Sections ==="
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.modinfo|\.versions" || true
          
          echo -e "\n=== CHECK: Undefined Symbols (Required by Kernel) ==="
          # 提取出模块需要内核提供的未定义符号
          readelf -s build/kpm_host-gki-6.6.ko | awk '$7 == "UND" && $8 != "" {print $8}'
          
          echo -e "\n=== CHECK: SHA256 ==="
          sha256sum build/kpm_host-gki-6.6.ko
          echo "=================================================="
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error
