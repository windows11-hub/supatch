name: Build and Verify KPM Host

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          set -e
          echo "=> KDIR: $KDIR"
          
          # 1. 移除源码里不支持的 6.6 CFI 调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c
          
          # 2. 编译模块
          echo "=> Compiling module..."
          make -C "$KDIR" \
            M="$PWD/src" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format" \
            modules

          # 3. 处理产物
          echo "=> Handling output..."
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
          else
            echo "=> ERROR: kpm_host.ko not found in src/"
            exit 1
          fi

          # 4. 用 Python 脚本在二进制层面强制替换 vermagic
          echo "=> Patching binary vermagic..."
          cat << 'EOF' > /tmp/patch_ko.py
import sys

ko_path = 'build/kpm_host-gki-6.6.ko'
with open(ko_path, 'rb') as f:
    data = f.read()

# 匹配 DDK 可能生成的所有 6.6.127 变体
old_vers = [
    b'6.6.127-4k-g46a034eca005-dirty SMP preempt mod_unload modversions aarch64',
    b'6.6.127 SMP preempt mod_unload modversions aarch64'
]
new_str = b'6.6.118-android15-11 SMP preempt mod_unload modversions aarch64'

patched = False
for old_str in old_vers:
    if old_str in data:
        # 用空字节补齐，保证长度完全一致
        pad_len = len(old_str) - len(new_str)
        replace_str = new_str + (b'\x00' * pad_len)
        data = data.replace(old_str, replace_str)
        patched = True
        print(f'==> Patched string: {old_str.decode()}')

if patched:
    with open(ko_path, 'wb') as f:
        f.write(data)
    print('==> Successfully patched file.')
else:
    print('==> Warning: old vermagic not found. Compiler may already use correct one.')
EOF

          python3 /tmp/patch_ko.py

          # 5. 输出体检信息
          echo ""
          echo "=================================================="
          echo "                 LKM VERIFICATION"
          echo "=================================================="
          echo "Vermagic:"
          modinfo -F vermagic build/kpm_host-gki-6.6.ko
          echo ""
          echo "Sections:"
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.modinfo|\.versions" || true
          echo ""
          echo "SHA256:"
          sha256sum build/kpm_host-gki-6.6.ko
          echo "=================================================="

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error
