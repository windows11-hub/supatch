name: Build and Verify KPM Host

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          set -e
          echo "=> KDIR: $KDIR"
          
          # 1. 移除源码里不支持的 6.6 CFI 调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c
          
          # 2. 编译模块
          echo "=> Compiling module..."
          make -C "$KDIR" \
            M="$PWD/src" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format" \
            modules

          # 3. 处理产物
          echo "=> Handling output..."
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
          else
            echo "=> ERROR: kpm_host.ko not found in src/"
            exit 1
          fi

          # 4. 二进制强改 Vermagic
          echo "=> Patching binary vermagic..."
          cat << 'EOF' > patch_vermagic.py
import sys

ko_path = 'build/kpm_host-gki-6.6.ko'
with open(ko_path, 'rb') as f:
    data = f.read()

old_strs = [
    b'6.6.127-4k-g46a034eca005-dirty SMP preempt mod_unload modversions aarch64',
    b'6.6.127 SMP preempt mod_unload modversions aarch64'
]
new_str = b'6.6.118-android15-11 SMP preempt mod_unload modversions aarch64'

for old_str in old_strs:
    if old_str in data:
        pad_len = len(old_str) - len(new_str)
        patched_str = new_str + b'\x00' * pad_len
        data = data.replace(old_str, patched_str)
        print(f'==> Replaced old vermagic: {old_str.decode()}')

with open(ko_path, 'wb') as f:
    f.write(data)
EOF
          
          python3 patch_vermagic.py

          # 5. 输出体检信息
          echo ""
          echo "=================================================="
          echo "                 LKM VERIFICATION"
          echo "=================================================="
          echo "Vermagic:"
          modinfo -F vermagic build/kpm_host-gki-6.6.ko
          
          echo -e "\n=== CHECK: Modversions & Sections ==="
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.modinfo|\.versions" || true
          
          echo -e "\n=== CHECK: Undefined Symbols (Required by Kernel) ==="
          # 提取出模块需要内核提供的未定义符号
          readelf -s build/kpm_host-gki-6.6.ko | awk '$7 == "UND" && $8 != "" {print $8}'
          
          echo -e "\n=== CHECK: SHA256 ==="
          sha256sum build/kpm_host-gki-6.6.ko
          echo "=================================================="
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error
