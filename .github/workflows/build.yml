name: Build and Verify KPM Host

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          # 1. 编译模块
          echo "=> Compiling module..."
          make -C "$KDIR" \
            M="$PWD/src" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format -Werror" \
            modules
          
          # 2. 处理产物
          echo "=> Handling output..."
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
          else
            echo "=> ERROR: kpm_host.ko not found in src/"
            exit 1
          fi
          
          # 3. patch vermagic (生成 python 脚本逐行 echo，避免 heredoc 问题)
          echo "ko_path = 'build/kpm_host-gki-6.6.ko'" > /tmp/patch_ko.py
          echo "with open(ko_path, 'rb') as f:" >> /tmp/patch_ko.py
          echo "    data = f.read()" >> /tmp/patch_ko.py
          echo "old_vers = [" >> /tmp/patch_ko.py
          echo "    b'6.6.127-4k-g46a034eca005-dirty SMP preempt mod_unload modversions aarch64'," >> /tmp/patch_ko.py
          echo "    b'6.6.127 SMP preempt mod_unload modversions aarch64'" >> /tmp/patch_ko.py
          echo "]" >> /tmp/patch_ko.py
          echo "new_str = b'6.6.118-android15-11 SMP preempt mod_unload modversions aarch64'" >> /tmp/patch_ko.py
          echo "patched = False" >> /tmp/patch_ko.py
          echo "for old_str in old_vers:" >> /tmp/patch_ko.py
          echo "    if old_str in data:" >> /tmp/patch_ko.py
          echo "        pad_len = len(old_str) - len(new_str)" >> /tmp/patch_ko.py
          echo "        replace_str = new_str + (b'\x00' * pad_len)" >> /tmp/patch_ko.py
          echo "        data = data.replace(old_str, replace_str)" >> /tmp/patch_ko.py
          echo "        patched = True" >> /tmp/patch_ko.py
          echo "        print('==> Patched string: ' + old_str.decode())" >> /tmp/patch_ko.py
          echo "if patched:" >> /tmp/patch_ko.py
          echo "    with open(ko_path, 'wb') as f:" >> /tmp/patch_ko.py
          echo "        f.write(data)" >> /tmp/patch_ko.py
          echo "    print('==> Successfully patched file.')" >> /tmp/patch_ko.py
          echo "else:" >> /tmp/patch_ko.py
          echo "    print('==> Warning: old vermagic not found.')" >> /tmp/patch_ko.py
          echo "=> Patching binary vermagic..."
          python3 /tmp/patch_ko.py
          
          # 4. 用户态 helper（suzhi_loader）
          #    这个 DDK 容器只带内核构建用的 clang，没有 aarch64 用户态 libc，
          #    因此**不在这里编**；由下面的 helper(ARM64) job 在原生 arm64 runner 上编译。
          echo ""
          echo "=> helper 由独立 job (ubuntu-24.04-arm) 原生编译，本 job 只产出 .ko"
          
          # 5. 输出体检信息（含未定义符号硬校验）
          echo ""
          echo "=================================================="
          echo "                 LKM VERIFICATION"
          echo "=================================================="
          echo "Vermagic:"
          modinfo -F vermagic build/kpm_host-gki-6.6.ko
          
          echo -e "\n=== CHECK: Modversions & Sections ==="
          VER_MAGIC=$(modinfo -F vermagic build/kpm_host-gki-6.6.ko)
          SECS=$(readelf -SW build/kpm_host-gki-6.6.ko 2>/dev/null)
          echo "$SECS" | grep -E "modinfo|__versions" || true
          
          # CRC check: vermagic claims modversions, so a __versions section must exist.
          # A CONFIG_MODVERSIONS kernel rejects a CRC-less module with ENOENT (os error 2).
          case "$VER_MAGIC" in
            *modversions*)
              if echo "$SECS" | grep -q "__versions"; then
                echo "==> CRC: __versions present (ok)"
              else
                echo "==> CRC: __versions ABSENT but vermagic says modversions"
                echo "    Target kernel will reject this ko with ENOENT (os error 2)."
                echo "    Build against the device kernel tree with CONFIG_MODVERSIONS=y"
                echo "    and keep the CRCs it emits; hand-patching vermagic alone is not enough."
              fi
              ;;
            *)
              echo "==> CRC: vermagic has no modversions token, __versions not required"
              ;;
          esac
          
          
          echo -e "\n=== CHECK: Undefined Symbols (Required by Kernel) ==="
          UNDEF=$(readelf -s build/kpm_host-gki-6.6.ko | awk '$7 == "UND" && $8 != "" {print $8}')
          echo "$UNDEF"
          
          # 残留非导出符号定位：把每处重定位归属到具体函数，并检查 CRC/.versions 段
          echo -e "\n=== CHECK: Relocation sources / owning function ==="
          python3 tools/reloc_owner.py build/kpm_host-gki-6.6.ko
          
          # 黑名单符号硬校验（WARN 不中断，便于继续出包定位）
          echo -e "\n=== CHECK: Non-exported anchor/patch symbols (must be ABSENT) ==="
          BAD=0
          for s in kallsyms_lookup_name caches_clean_inv_pou system_cpucaps alt_cb_patch_nops; do
            if echo "$UNDEF" | grep -qx "$s"; then
              echo "  FAIL: '$s' still an undefined (non-exported) dependency!"
              BAD=1
            else
              echo "  ok  : '$s' absent from UNDEF"
            fi
          done
          if [ "$BAD" -ne 0 ]; then
            echo "==> WARN: module has residual non-exported UNDEF above."
            echo "    Inspect relocation sources above to find who references them."
          else
            echo "==> PASS: no non-exported anchor dependencies."
          fi
          
          # 完整 UNDEF 清单（人工核对）
          echo -e "\n=== CHECK: Undefined symbols (full) ==="
          readelf -sW build/kpm_host-gki-6.6.ko 2>/dev/null \
            | awk '$7 == "UND" && $8 != "" {print}'
          
          echo -e "\n=== CHECK: SHA256 ==="
          sha256sum build/kpm_host-gki-6.6.ko
          echo "=================================================="
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error

  helper:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build suzhi_loader (native aarch64)
        shell: bash
        run: |
          set -e
          echo "=> host arch: $(uname -m)"
          gcc -O2 -static -o build_suzhi_loader_arm64 helper/suzhi_loader.c
          ls -l build_suzhi_loader_arm64
          file build_suzhi_loader_arm64 || true

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: suzhi_loader-arm64
          path: build_suzhi_loader_arm64
          if-no-files-found: error
