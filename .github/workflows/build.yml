name: Build and Verify KPM Host

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify
        shell: bash
        run: |
          set -e
          echo "=> KDIR: $KDIR"

          # 1. 在源码里强行注入 MODULE_INFO (如果源码没改的话)
          if ! grep -q 'MODULE_INFO(vermagic' src/kpm_host_core.c; then
            sed -i '/MODULE_LICENSE("GPL v2");/a MODULE_INFO(vermagic, "6.6.118-android15-11 SMP preempt mod_unload modversions aarch64");' src/kpm_host_core.c
          fi
          
          # 2. 移除源码里不支持的 6.6 CFI 调用
          sed -i '/resolve_cfi_shadow();/d' src/kpm_host_core.c
          
          # 3. 编译模块
          echo "=> Compiling module..."
          make -C "$KDIR" \
            M="$PWD/src" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KCFLAGS="-ffixed-x18 -Wno-format" \
            modules

          # 4. 处理产物
          echo "=> Handling output..."
          mkdir -p build
          if [ -f "src/kpm_host.ko" ]; then
            mv src/kpm_host.ko build/kpm_host-gki-6.6.ko
          else
            echo "=> ERROR: kpm_host.ko not found in src/"
            exit 1
          fi

          # 5. 输出体检信息
          echo ""
          echo "=================================================="
          echo "                 LKM VERIFICATION"
          echo "=================================================="
          echo "Vermagic:"
          modinfo -F vermagic build/kpm_host-gki-6.6.ko
          echo ""
          echo "Sections:"
          readelf -S build/kpm_host-gki-6.6.ko | grep -E "\.modinfo|\.versions" || true
          echo ""
          echo "SHA256:"
          sha256sum build/kpm_host-gki-6.6.ko
          echo "=================================================="

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm_host-gki-6.6
          path: build/kpm_host-gki-6.6.ko
          if-no-files-found: error
